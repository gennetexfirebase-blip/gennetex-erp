<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тооллого — Gennetex</title>
    <meta name="description" content="Gennetex — Excel тооллого харьцуулах хэрэгсэл. Үр дүн серверт хадгалагдана." />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ec-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
