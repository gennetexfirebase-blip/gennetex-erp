<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gennetex Акт — Холболт тасарсан</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f8; color: #172033; font: 14px/1.55 "Segoe UI", Arial, sans-serif; }
      main { width: min(420px, calc(100vw - 32px)); padding: 32px; border: 1px solid #e2e8f0; border-radius: 14px; background: #fff; box-shadow: 0 18px 50px rgba(15, 23, 42, .09); text-align: center; }
      .mark { display: grid; width: 44px; height: 44px; margin: 0 auto 18px; place-items: center; border-radius: 10px; background: #159bd7; color: #fff; font-weight: 800; }
      h1 { margin: 0; font-size: 21px; }
      p { margin: 10px 0 22px; color: #5f6c7b; }
      button { width: 100%; height: 42px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 650; cursor: pointer; }
      button:hover { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">G</div>
      <h1>Сүлжээний холболт алга</h1>
      <p>Актын системтэй холбогдож чадсангүй. Интернэт холболтоо шалгаад дахин оролдоно уу.</p>
      <button type="button" id="retry">Дахин холбогдох</button>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById('retry').addEventListener('click', () => {
        location.href = params.get('retry') || 'https://akt.gennetex.com';
      });
    </script>
  </body>
</html>
