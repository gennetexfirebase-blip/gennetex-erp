name: Android APK build

# Гараар ажиллуулна (Actions → Android APK build → Run workflow).
# EAS ашиглахгүй — GitHub-ийн runner дээр Gradle-ээр шууд барина.
on:
  # `v1.3.3` мэтийн tag түлхэхэд АВТОМАТААР release build хийнэ.
  # Ингэснээр хувилбар гаргах = tag түлхэх болж, Actions руу орж
  # гараар товч дарах шаардлагагүй.
  push:
    tags:
      # `v1.3.5` → release build (тараах APK)
      - 'v*'
      # `dev-1` → DEBUG build. Энэ нь Expo Go-ийн орлуулагч:
      # JS bundle-ийг дотроо агуулахгүй, Metro dev server-ээс уншина.
      # Тиймээс кодоо засмагц утсан дээр шууд шинэчлэгдэнэ.
      - 'dev-*'
  workflow_dispatch:
    inputs:
      variant:
        # ⚠️ ТАРААХДАА ЗААВАЛ `release`.
        #   `assembleDebug` нь JS bundle-ийг APK дотор ОРУУЛДАГГҮЙ —
        #   апп Metro dev server рүү холбогдохыг оролдоод утсан дээр
        #   ажиллахгүй. Мөн JS өөрчлөлт APK-д тусахгүй тул хувилбар
        #   солигдсон ч файл ЯГ ИЖИЛ байтаар гарна (2026-08-27-нд
        #   1.3.1 ба 1.3.2 ижил гарснаар илэрсэн).
        #   `debug` нь зөвхөн native талын алдаа шалгахад хэрэгтэй.
        description: 'Build төрөл (тараахдаа ЗААВАЛ release)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - bundle
          - debug
      release_tag:
        description: 'GitHub Release-ийн tag (ж: v1.3.0). Хоосон бол release үүсгэхгүй.'
        required: false
        default: ''
        type: string

env:
  # Tag түлхэлтээр ажиллахад `inputs` хоосон байдаг тул энд нэгтгэнэ.
  VARIANT: ${{ inputs.variant || (startsWith(github.ref_name, 'dev-') && 'debug') || 'release' }}
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Release үүсгэж APK хавсаргахад бичих эрх шаардлагатай.
    # Эс бөгөөс `gh release create` нь HTTP 403 өгнө.
    permissions:
      contents: write

    steps:
      - name: Кодоо татах
        uses: actions/checkout@v4

      - name: Node суулгах
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java (JDK 17) суулгах
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK бэлдэх
        uses: android-actions/setup-android@v3

      # ── Нууц тохиргоонууд ─────────────────────────────────────────
      # `.env` болон `google-services.json` нь git-д ОРДОГГҮЙ тул
      # GitHub Secrets-ээс сэргээнэ. Байхгүй бол build-ыг эрт зогсоож,
      # алдаатай APK гаргахаас сэргийлнэ.
      #
      # ⚠️ Эдгээрийг `npm ci`-ЭЭС ӨМНӨ үүсгэнэ: postinstall дээр
      # `sync-google-services.js` ажилладаг тул файл нь тэр үед бэлэн
      # байх ёстой.
      - name: .env үүсгэх
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          DEVELOPER_EMAIL: ${{ secrets.EXPO_PUBLIC_DEVELOPER_EMAIL }}
          MAPS_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY secret тохируулаагүй байна."
            exit 1
          fi
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "EXPO_PUBLIC_DEVELOPER_EMAIL=$DEVELOPER_EMAIL"
            echo "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=$MAPS_KEY"
          } > .env
          echo ".env үүслээ ($(wc -l < .env) мөр)"
          # ⚠️ Түлхүүргүй бол `app.config.js` нь AndroidManifest-д
          # `com.google.android.geo.API_KEY` meta-data-г БИЧИХГҮЙ бөгөөд
          # газрын зураг агуулсан дэлгэц (Ирц) нээх бүрд апп НАТИВ талдаа
          # `IllegalStateException: API key not found` шидэж унадаг.
          # Одоо `components/Map.js` орлуулагч харуулж унахаас сэргийлдэг
          # ч газрын зураг харагдахгүй тул анхааруулна.
          if [ -z "$MAPS_KEY" ]; then
            echo "::warning::EXPO_PUBLIC_GOOGLE_MAPS_API_KEY secret алга — газрын зураг харагдахгүй (апп унахгүй)."
          else
            echo "Google Maps түлхүүр тохирлоо."
          fi

      - name: google-services.json сэргээх
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret алга (Firebase мэдэгдэл ажиллахгүй)."
            exit 1
          fi
          echo "$GS" | base64 -d > google-services.json
          node -e "JSON.parse(require('fs').readFileSync('google-services.json','utf8')); console.log('google-services.json хүчинтэй')"

      - name: Хамаарлууд суулгах
        run: npm ci

      # ── Native төсөл үүсгэх ───────────────────────────────────────
      - name: Prebuild (android/ үүсгэх)
        run: npx expo prebuild --platform android --no-install

      # `expo prebuild` нь `android/`-ыг ШИНЭЭР үүсгэдэг тул native
      # засварууд (patch) болон google-services хуулалт дахин хэрэгтэй.
      # Энэ нь `eas-build-post-install` script-тэй ижил алхам.
      - name: Prebuild-ийн дараах засварууд
        run: |
          node scripts/patch-incoming-call-rn81.js
          node scripts/sync-google-services.js
          test -f android/app/google-services.json \
            && echo "android/app/google-services.json бэлэн" \
            || { echo "::error::android/app/google-services.json үүсээгүй"; exit 1; }

      # ── Release гарын үсэг (зөвхөн variant=release үед) ───────────
      - name: Release keystore тавих
        if: ${{ env.VARIANT == 'release' || env.VARIANT == 'bundle' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::release/bundle build-д ANDROID_KEYSTORE_BASE64 ба ANDROID_KEYSTORE_PASSWORD secret шаардлагатай."
            exit 1
          fi
          mkdir -p credentials
          echo "$KEYSTORE_B64" | base64 -d > credentials/gennetex-release.keystore
          printf '%s' "$KEYSTORE_PASSWORD" > credentials/.keystore-password.txt
          node scripts/setup-release-signing.js

      # ── Барих ─────────────────────────────────────────────────────
      - name: APK барих
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          # ⚠️ Google Play нь 2021 оноос .aab (App Bundle) ЗААВАЛ шаарддаг.
          #    APK нь зөвхөн шууд тараахад (/app хуудас) хэрэглэгдэнэ.
          TASK=assembleDebug
          [ "${{ env.VARIANT }}" = "release" ] && TASK=assembleRelease
          [ "${{ env.VARIANT }}" = "bundle" ]  && TASK=bundleRelease

          # Play-д илгээх bundle нь хуучин төхөөрөмжийг ч хамрах ёстой.
          ARCHS=arm64-v8a
          [ "${{ env.VARIANT }}" = "bundle" ] && ARCHS=arm64-v8a,armeabi-v7a

          ./gradlew "$TASK" --no-daemon --stacktrace \
            -PreactNativeArchitectures=$ARCHS 2>&1 | tee /tmp/gradle.log

      # ⚠️ Gradle унахад GitHub нь annotation-д зөвхөн "exit code 1" гэж
      # бичдэг бөгөөд бодит алдаа зөвхөн бүтэн лог дотор үлддэг. Тэр логийг
      # унших API нь нэвтрэлт шаарддаг тул шалтгаан гаднаас харагдахгүй.
      # Энд гол мөрүүдийг annotation болгож гаргана.
      - name: Gradle-ийн алдааг ил гаргах
        if: failure()
        run: |
          echo "::group::Gradle log (сүүлийн 300 мөр)"
          tail -300 /tmp/gradle.log || echo "лог үүсээгүй"
          echo "::endgroup::"
          # ⚠️ `WARNING`-уудыг ЗААВАЛ хасна. `play-services-auth` нь D8-ийн
          # "Invalid stack map table" анхааруулгыг олон арваар цацдаг
          # бөгөөд тэдгээр нь build-ыг унагадаггүй. Хасахгүй бол
          # annotation-ийн тооны хязгаарыг дүүргэж, ЖИНХЭНЭ алдааг
          # шахаж гаргадаг (2026-08-27-нд яг ингэж болсон).
          grep -E "FAILURE:|What went wrong|Execution failed|Caused by:|^e: |^\s+> " /tmp/gradle.log \
            | grep -v "WARNING" | head -20 \
            | while IFS= read -r line; do echo "::error::$line"; done || true

      # APK дотор JS bundle БАЙГАА ЭСЭХИЙГ баталгаажуулна.
      # Bundle-гүй APK нь суусан ч ажиллахгүй бөгөөд гаднаас нь ялгаж
      # мэдэхэд хэцүү тул энд зогсоох нь дээр.
      - name: JS bundle шалгах
        if: ${{ env.VARIANT == 'release' }}   # .aab өөр бүтэцтэй тул алгасна
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          if unzip -l "$APK" | grep -q "index.android.bundle"; then
            echo "✅ JS bundle APK дотор байна"
          else
            echo "::error::APK дотор index.android.bundle АЛГА — апп ажиллахгүй."
            exit 1
          fi

      - name: APK-г нэрлэх
        id: apk
        run: |
          VERSION=$(node -e "console.log(require('./app.json').expo.version)")
          if [ "${{ env.VARIANT }}" = "bundle" ]; then
            SRC=$(find android/app/build/outputs/bundle -name "*.aab" | head -1)
          else
            SRC=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          fi
          if [ -z "$SRC" ]; then
            echo "::error::Гаралтын файл олдсонгүй."
            exit 1
          fi
          # ⚠️ Debug APK-г ЗААВАЛ өөр нэрээр гаргана. Тэр нь JS bundle-гүй
          # бөгөөд Metro dev server-гүйгээр ажиллахгүй тул ажилтнуудад
          # тараавал "апп нээгдэхгүй" болно.
          case "${{ env.VARIANT }}" in
            release) OUT="gennetex-erp-${VERSION}.apk" ;;
            bundle)  OUT="gennetex-erp-${VERSION}.aab" ;;
            *)       OUT="gennetex-erp-${VERSION}-dev.apk" ;;
          esac
          cp "$SRC" "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$OUT")" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Artifact болгон хадгалах
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # ── GitHub Release руу байршуулах ─────────────────────────────
      - name: Release үүсгэж APK хавсаргах
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
              --title "Gennetex ERP $TAG" \
              --notes "Хувилбар ${{ steps.apk.outputs.version }} · ${{ env.VARIANT }} build"
          fi
          echo "Татах холбоос:"
          echo "https://github.com/${{ github.repository }}/releases/download/$TAG/${{ steps.apk.outputs.path }}"

      - name: Дүгнэлт
        run: |
          {
            echo "### APK бэлэн боллоо"
            echo ""
            echo "- Хувилбар: **${{ steps.apk.outputs.version }}**"
            echo "- Төрөл: **${{ env.VARIANT }}**"
            echo "- Хэмжээ: **$(( ${{ steps.apk.outputs.size }} / 1048576 )) MB**"
            echo "- sizeBytes (latest.json-д хэрэгтэй): \`${{ steps.apk.outputs.size }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
