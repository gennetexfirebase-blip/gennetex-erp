<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111312" />
    <script>
      // Сэдвийг эрт тогтооно — ачаалахад цагаан «гялс» гарахгүй (src/lib/theme.ts-тэй ижил).
      try {
        var p = localStorage.getItem('gx_theme');
        var d = p === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : p !== 'light';
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <title>GENNETEX — Админ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
