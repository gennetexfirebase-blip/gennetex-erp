<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Гарч ирэх маягт</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="content-container">
        <h1>Бодит ертөнцөд тавтай морил</h1>
        <p>
          Энэ бол жишээ текст бөгөөд хуудасны бүтэц, загварыг харуулахад зориулагдсан. Бодит агуулга энд байрлана. Монгол хэлээр бичсэн энэхүү текст нь дизайныг харахад тусална. Хүссэн мэдээллээ энд оруулж, өөрийн хэрэгцээнд.
        </p>
        <button class="cta-btn" id="open">Бүртгүүлэх</button>
      </div>
    </header>

    <section class="modal-container" id="modal">
      <section class="modal">
        <button class="close-btn" id="close">x</button>
        <div class="modal-content">
          <h1>Бүртгүүлэх</h1>
          <form class="modal-form">
            <div>
              <label for="name">Нэр</label>
              <input
                type="text"
                id="name"
                placeholder="Нэр оруулна уу"
                class="form-input"
              />
            </div>
            <div>
              <label for="email">Имэйл</label>
              <input
                type="text"
                id="email"
                placeholder="Имэйл оруулна уу"
                class="form-input"
              />
            </div>
            <div>
              <label for="password">Нууц үг</label>
              <input
                type="text"
                id="password"
                placeholder="Нууц үг оруулна уу"
                class="form-input"
              />
            </div>
            <div>
              <label for="password2">Нууц үг давтах</label>
              <input
                type="text"
                id="password2"
                placeholder="Нууц үг давтах"
                class="form-input"
              />
            </div>
            <input type="submit" value="Илгээх" class="submit-btn" />
          </form>
        </div>
      </section>
    </section>

    <script src="app.js"></script>
  </body>
</html>
