<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Хоол хайгч</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <nav>
      <form class="input-container">
        <input type="text" class="input" placeholder="Хайх ..." />
        <i class="fa-solid fa-magnifying-glass magnifier"></i>
      </form>

      <ul>
        <li>Өглөөний цай</li>
        <li>Эхлүүлэх</li>
        <li>Оройн хоол</li>
      </ul>
    </nav>

    <main>
      <div class="container">
        <div class="img"></div>

        <div class="content-container">
          <h1 class="title">Хоолны нэр</h1>
          <p class="info">
            Энэ бол жишээ текст бөгөөд хуудасны бүтэц, загварыг харуулахад зориулагдсан. Бодит агуулга энд байрлана. Монгол хэлээр бичсэн энэхүү текст нь.
          </p>
          <button class="main-btn">$20 — Одоо захиалах</button>
        </div>
      </div>
    </main>

    <section class="ingredients"></section>

    <script src="app.js"></script>
  </body>
</html>
