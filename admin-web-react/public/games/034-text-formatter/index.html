<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Текст засагч</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="input-container">
        <h2>Үгээ бичнэ үү</h2>
        <input type="text" id="input-field" placeholder="Текстээ энд бичнэ үү" />
      </div>

      <div class="btns-container">
        <button class="btn uppercase">АБВ</button>
        <button class="btn lowercase">abc</button>
        <button class="btn capitalize">Абв</button>
        <button class="btn bold">B</button>
        <button class="btn italic">/</button>
        <button class="btn underline">АБВ</button>
      </div>

      <p id="output-field">Үр дүн</p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
