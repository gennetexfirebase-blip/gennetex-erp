<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Шинэ маягт</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="signup">
        <span>Бүртгэлгүй юу?</span>
        <button type="button" class="sign-up-btn">Бүртгүүлэх</button>
      </div>
      <div class="login">
        <span>Бүртгэлтэй юу?</span>
        <button type="button">Нэвтрэх</button>
      </div>

      <div class="back-layer">
        <form action="" class="login-form active">
          <h2 class="login-label">Нэвтрэх</h2>
          <input type="email" id="lemail" placeholder="Имэйл" />
          <input type="password" id="lpassword" placeholder="Нууц үг" />
          <button type="button">Нэвтрэх</button>
        </form>

        <form action="" class="signup-form">
          <h2>Бүртгүүлэх</h2>
          <input type="text" id="f-name" placeholder="Нэр" />
          <input type="text" id="l-name" placeholder="Овог" />
          <input type="email" id="semail" placeholder="Имэйл" />
          <input type="password" id="spassword" placeholder="Нууц үг" />
          <button type="button">Бүртгүүлэх</button>
        </form>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
